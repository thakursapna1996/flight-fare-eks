name: CD

# Build, push to ECR and roll out to EKS on every push to main.
# Authentication is via GitHub OIDC -> an IAM role (no long-lived AWS keys
# stored in GitHub). Set the repo variables/secrets referenced below first.
on:
  #push:
    #branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  K8S_NAMESPACE: flight-fare
  DEPLOYMENT: flight-fare-api

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Deploy to EKS
        run: |
          kubectl apply -k infra/k8s
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/"$DEPLOYMENT" api="$IMAGE"
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/"$DEPLOYMENT" --timeout=180s
