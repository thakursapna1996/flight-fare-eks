apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-fare-api
  namespace: flight-fare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-fare-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
