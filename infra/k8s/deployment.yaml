apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-fare-api
  namespace: flight-fare
  labels:
    app.kubernetes.io/name: flight-fare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flight-fare-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flight-fare-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replaced by CI with the ECR image + immutable tag at deploy time.
          image: REPLACED_BY_CI
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Liveness: restart the pod if the process wedges.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness: only send traffic once the model is loaded.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
